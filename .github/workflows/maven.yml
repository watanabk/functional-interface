# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Maven Profile'
        required: true
        default: 'staging'

jobs:
  build:

    runs-on: [self-hosted, windows]

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn clean package -P${{github.event.inputs.profile}} -Dmaven.test.failure.ignore --file pom.xml

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
#    - name: Update dependency graph
#      uses: advanced-security/maven-dependency-submission-action@v4

    # Deploy to Tomcat
#    - name: Deploy to Tomcat
#      run: curl -u ${{ secrets.TOMCAT_USER }}:${{ secrets.TOMCAT_PASS }} -T target/*.war "http://${{ secrets.TOMCAT_HOST }}/manager/text/deploy?path=/app&update=true"


    # ② Tomcatに直接デプロイ（ローカル）
    - name: Deploy to Tomcat
      env:
        TOMCAT_USER: ${{ secrets.TOMCAT_USER }}
        TOMCAT_PASS: ${{ secrets.TOMCAT_PASS }}
      run: |
        powershell -Command "
          $war = Get-ChildItem target\*.war | Select-Object -First 1;
          Write-Host 'Deploying:' $war.FullName;

          curl.exe -u $env:TOMCAT_USER`:$env:TOMCAT_PASS `
            -T $war.FullName `
            'http://localhost:8080/manager/text/deploy?path=/app&update=true';
        "
